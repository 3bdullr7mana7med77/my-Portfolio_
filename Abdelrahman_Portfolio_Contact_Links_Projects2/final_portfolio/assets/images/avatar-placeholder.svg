<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Lines -->
  <path d="M40 0 v400 M80 0 v400 M120 0 v400 M160 0 v400 M200 0 v400 M240 0 v400 M280 0 v400 M320 0 v400 M360 0 v400" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.06" />
  <path d="M0 40 h400 M0 80 h400 M0 120 h400 M0 160 h400 M0 200 h400 M0 240 h400 M0 280 h400 M0 320 h400 M0 360 h400" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.06" />

  <!-- Abstract AI Orbit / Halo Ring -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="200" cy="180" r="145" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25" />

  <!-- Glowing AI Node Accents -->
  <circle cx="90" cy="120" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="310" cy="140" r="5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="325" cy="240" r="4" fill="#6366f1" filter="url(#glow)" />
  <circle cx="75" cy="260" r="5" fill="#38bdf8" filter="url(#glow)" />
  <line x1="90" y1="120" x2="140" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <line x1="310" y1="140" x2="260" y2="160" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Avatar Silhouette / Stylized AI Developer -->
  <path d="M100 370 C100 290, 140 270, 200 270 C260 270, 300 290, 300 370 Z" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="2" />
  <path d="M165 270 L200 315 L235 270" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Head -->
  <ellipse cx="200" cy="185" rx="55" ry="68" fill="#334155" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Stylized Hair -->
  <path d="M145 175 C145 125, 170 115, 200 115 C230 115, 255 125, 255 175 C245 135, 230 128, 200 128 C170 128, 155 135, 145 175 Z" fill="#0f172a" />

  <!-- AI HUD Visor / Neural Interface Eyes -->
  <rect x="160" y="172" width="80" height="14" rx="7" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.9" />
  <circle cx="180" cy="179" r="3" fill="#ffffff" />
  <circle cx="220" cy="179" r="3" fill="#ffffff" />

  <!-- Data Stream Nodes around Head -->
  <path d="M130 185 L145 185" stroke="#38bdf8" stroke-width="2" />
  <path d="M255 185 L270 185" stroke="#a855f7" stroke-width="2" />
  <circle cx="126" cy="185" r="3" fill="#38bdf8" />
  <circle cx="274" cy="185" r="3" fill="#a855f7" />

  <!-- Monogram Pill / Badge at Bottom -->
  <g transform="translate(130, 345)">
    <rect width="140" height="32" rx="16" fill="#090d16" stroke="url(#primaryGrad)" stroke-width="1.5" />
    <text x="70" y="21" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">AI DEVELOPER</text>
  </g>
</svg>
